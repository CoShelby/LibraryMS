{% extends "base.html" %}

{% block title %}تعديل الأدمن{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto space-y-5">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-black">تعديل الأدمن: {{ admin_user.username }}</h1>
        <a href="{% url 'dashboard_admin_users' %}" class="btn-secondary">رجوع</a>
    </div>

    <form method="post" class="card space-y-3">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-bold mb-1">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn-primary w-full">حفظ التعديلات</button>
    </form>
</section>
{% endblock %}
