{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة QR للنسخ</title>
    <style>
        @page {
            size: A4;
            margin: 8mm;
        }

        body {
            margin: 0;
            font-family: "Cairo", "Tahoma", "Arial", sans-serif;
            color: #111827;
            background: #f8fafc;
        }

        .page {
            width: 194mm;
            min-height: 281mm;
            margin: 0 auto;
            box-sizing: border-box;
            page-break-after: always;
        }

        .page:last-child {
            page-break-after: auto;
        }

        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(6, minmax(0, 1fr));
            gap: 4mm;
            min-height: 281mm;
            width: 100%;
            box-sizing: border-box;
        }

        .qr-item {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .qr-canvas {
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
        }

        .qr-code-text {
            margin-top: 8px;
            font-weight: 800;
            font-size: 14px;
            direction: ltr;
        }

        .book-title {
            margin-top: 4px;
            font-size: 11px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }

        .print-meta {
            text-align: center;
            margin: 0 0 8px;
            color: #475569;
            font-size: 12px;
        }

        .print-actions {
            text-align: center;
            margin: 12px 0 16px;
        }

        .print-actions button {
            background: #0f172a;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
        }

        @media print {
            body {
                background: #fff;
            }

            .print-actions {
                display: none;
            }

            .page {
                width: 194mm;
                min-height: 281mm;
            }
        }
    </style>
</head>
<body>
    <div class="print-actions">
        <button type="button" id="manualPrintButton">طباعة الآن</button>
    </div>

    <div class="print-meta">تاريخ التحضير للطباعة: {{ printed_at|date:"Y-m-d H:i" }}</div>

    {% for page in pages %}
        <section class="page">
            <div class="sheet-grid">
                {% for copy in page %}
                    <article class="qr-item">
                        <div class="qr-canvas" data-copy-code="{{ copy.barcode }}"></div>
                        <div class="qr-code-text">{{ copy.barcode }}</div>
                        <div class="book-title">{{ copy.book.title }}</div>
                    </article>
                {% endfor %}
            </div>
        </section>
    {% endfor %}

    {{ printed_copy_ids|json_script:"printed-copy-ids" }}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let copiesMarked = false;

        function markPrintedCopies() {
            if (copiesMarked) return;
            copiesMarked = true;

            const ids = JSON.parse(document.getElementById('printed-copy-ids').textContent || '[]');
            fetch("{% url 'dashboard_mark_copies_printed' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ copy_ids: ids })
            }).catch(() => {
                copiesMarked = false;
            });
        }

        document.querySelectorAll('.qr-canvas').forEach((item) => {
            const copyCode = item.dataset.copyCode;
            if (!copyCode) return;

            if (typeof QRCode === 'function') {
                new QRCode(item, {
                    text: copyCode,
                    width: 150,
                    height: 150,
                    correctLevel: QRCode.CorrectLevel.M,
                });
            } else {
                item.textContent = copyCode;
            }
        });

        document.getElementById('manualPrintButton')?.addEventListener('click', () => window.print());
        window.addEventListener('afterprint', markPrintedCopies);
        window.addEventListener('load', () => setTimeout(() => window.print(), 300));
    </script>
</body>
</html>
