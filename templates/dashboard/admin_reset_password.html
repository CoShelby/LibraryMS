{% extends "base.html" %}

{% block title %}تعيين كلمة مرور الأدمن{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md card">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black">تعيين كلمة مرور</h1>
            <p class="text-sm text-slate-500 mt-1">الحساب: {{ admin_user.username }}</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}


            {% for field in form %}
                <div>
                    <label class="block text-sm font-bold mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-primary w-full py-3">حفظ كلمة المرور</button>
        </form>
    </div>
</div>
{% endblock %}
