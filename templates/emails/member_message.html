<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            padding: 0;
            background: #ece0ca;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: #1f1b1b;
        }
        .shell {
            width: 100%;
            padding: 32px 16px;
            box-sizing: border-box;
        }
        .card {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid rgba(93, 62, 63, 0.14);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(93, 62, 63, 0.12);
        }
        .hero {
            padding: 32px;
            background: linear-gradient(135deg, #5d3e3f 0%, #734f50 52%, #967462 100%);
            color: #ffffff;
        }
        .eyebrow {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(236, 224, 202, 0.18);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .hero h1 {
            margin: 16px 0 8px;
            font-size: 28px;
            line-height: 1.3;
        }
        .hero p {
            margin: 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
        }
        .content {
            padding: 32px;
        }
        .message {
            padding: 24px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fffdf8, #f3ede2);
            border: 1px solid rgba(150, 116, 98, 0.18);
            line-height: 1.9;
            font-size: 15px;
        }
        .message p {
            margin: 0;
        }
        .message p + p {
            margin-top: 16px;
        }
        .footer {
            padding: 0 32px 32px;
            color: #967462;
            font-size: 13px;
        }
        @media (max-width: 640px) {
            .shell {
                padding: 16px 10px;
            }
            .hero,
            .content,
            .footer {
                padding-left: 20px;
                padding-right: 20px;
            }
            .hero h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="card">
            <div class="hero">
                <span class="eyebrow">{{ library_name }}</span>
                <h1>{{ subject }}</h1>
                {% if library_tagline %}<p>{{ library_tagline }}</p>{% endif %}
            </div>
            <div class="content">
                <div class="message">{{ body|linebreaks }}</div>
            </div>
            <div class="footer">
                <div>{{ library_name }}</div>
                <div>{{ member.email }}</div>
            </div>
        </div>
    </div>
</body>
</html>
